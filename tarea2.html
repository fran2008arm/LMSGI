<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="Página de prueba con imágenes y videos incrustados">
    <meta name="author" content="Francisco">
    <title>Mi Página Multimedia</title>

</head>
<body>
    <h1>
        Mi sección de video e imagen.
    </h1>
      <nav>
        <ul>
            <li><a href="#seccion-imagen">Saltar a la Imagen</a></li>
            <li><a href="#seccion-video">Saltar al Video</a></li>
        </ul>
    </nav>
    <hr>
    <div id="seccion-imagen">
        <h2>
            Fotografía Destacada

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPZ3skDyrNFx-_qlAgBfc0s2F2Om5JO6oq8zyBUDZkuw&s=10" alt="Paisaje de muestra con montañas y lago" width="600" height="400"
        >
        <p>
            Esta es una imagen ilustrativa insertada usando rutas web estándar.
        </p>
    </div>
    <hr>
  <div id="seccion-video">
        <h2>Video Tutorial de YouTube</h2>
        <iframe width="560" height="315" 
                src="https://www.youtube.com/embed/GnF6VHwvV4I?si=dmF2A0WD20cpA-f9" 
                title="Reproductor de video" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

</html>
